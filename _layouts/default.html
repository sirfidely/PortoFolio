<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{% seo %}
{% feed_meta %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
<nav class="nav" aria-label="Sections">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">Fidel N'zoué<span>.</span></a>
    <ul>
      <li><a class="l" href="{{ '/#geniuspay' | relative_url }}">GeniusPay</a></li>
      <li><a class="l{% if page.url contains '/projets' %} on{% endif %}" href="{{ '/projets/' | relative_url }}">Projets</a></li>
      <li><a class="l" href="{{ '/#parcours' | relative_url }}">Parcours</a></li>
      <li><a class="l{% if page.url contains '/blog' %} on{% endif %}" href="{{ '/blog/' | relative_url }}">Blog</a></li>
      <li><a class="l{% if page.url contains '/ressources' %} on{% endif %}" href="{{ '/ressources/' | relative_url }}">Ressources</a></li>
      <li><a class="l" href="{{ '/#contact' | relative_url }}">Contact</a></li>
    </ul>
  </div>
</nav>
{{ content }}
<footer>
  <div class="wrap"><span>© {{ site.time | date: "%Y" }} Fidel Mondésir N'zoué</span><span><a href="{{ '/blog/feed.xml' | relative_url }}">Flux RSS</a> · Abidjan, Côte d'Ivoire</span></div>
</footer>
</body>
</html>
